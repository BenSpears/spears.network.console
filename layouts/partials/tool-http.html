<div class="tool" data-tool="http">
  <div class="tool-row">
    <label class="tool-label" for="http-q">search</label>
    <input class="tool-input" id="http-q" type="text" spellcheck="false" autocomplete="off"
           placeholder="e.g. 404, teapot, redirect, gateway" style="flex:1 1 220px">
  </div>
  <p class="tool-hint"><span id="http-count"></span> Search by code, name, or meaning.</p>
  <div class="tool-out" id="http-out">
    <table class="tool-table">
      <thead><tr><th>Code</th><th>Name</th><th>Meaning</th></tr></thead>
      <tbody id="http-body"></tbody>
    </table>
  </div>
</div>
