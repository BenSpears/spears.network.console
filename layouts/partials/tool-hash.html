<div class="tool" data-tool="hash">
  <div class="tool-row">
    <label class="tool-label" for="th-in">text</label>
  </div>
  <textarea class="tool-area" id="th-in" rows="4" spellcheck="false" placeholder="type or paste text to hash"></textarea>
  <p class="tool-hint">Hashed locally as you type (UTF-8). Click any hash to copy it. Nothing is transmitted.</p>
  <div class="tool-out" id="th-out">
    <table class="tool-table"><tbody id="th-body"></tbody></table>
  </div>
</div>
