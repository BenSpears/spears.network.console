<div class="tool" data-tool="cidr">
  <div class="tool-row">
    <label class="tool-label" for="cidr-q">filter</label>
    <input class="tool-input" id="cidr-q" type="text" spellcheck="false" autocomplete="off"
           placeholder="e.g. 24, 255.255.255.0, or /30" style="flex:1 1 220px">
  </div>
  <div class="tool-out" id="cidr-out">
    <table class="tool-table">
      <thead><tr><th>CIDR</th><th>Netmask</th><th>Wildcard</th><th>Addresses</th><th>Usable</th></tr></thead>
      <tbody id="cidr-body"></tbody>
    </table>
  </div>
</div>
