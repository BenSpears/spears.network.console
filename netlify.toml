[build]
  publish = "public"
  command = "hugo --gc --minify"

[build.environment]
  HUGO_VERSION = "0.164.0"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ---- outbound referral redirects (first-party, no tracker in the visible link) ----
# When your Proton partner account is approved, change `to` to your affiliate URL.
[[redirects]]
  from = "/go/proton"
  to = "https://proton.me/"
  status = 302
  force = true

# ---- security headers (apply to every response) ----
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://cloudflare-dns.com https://freedns.controld.com https://dns.quad9.net; font-src 'self'; frame-src https://www.youtube-nocookie.com; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self \"https://www.youtube-nocookie.com\"), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    X-DNS-Prefetch-Control = "off"

# ---- long-cache immutable, content-hashed assets ----
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/apps/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[context.production.environment]
  HUGO_ENV = "production"

# Pretty 404 handling is automatic: Hugo emits /404.html which Netlify serves.
